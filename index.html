<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vejr Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Vejr Dashboard</h1>
            <p id="location">Henter din position...</p>
        </header>
        
        <main>
            <div class="current-weather">
                <div class="weather-icon">
                    <i id="weather-icon" class="wi wi-day-sunny"></i>
                </div>
                <div class="temp">
                    <span id="temperature">--</span><span class="unit">°C</span>
                </div>
                <div class="description" id="description">--</div>
            </div>
            
            <div class="details">
                <div class="detail-card">
                    <i class="wi wi-thermometer"></i>
                    <div>
                        <span class="label">Føles som</span>
                        <span id="feels-like">--°C</span>
                    </div>
                </div>
                <div class="detail-card">
                    <i class="wi wi-humidity"></i>
                    <div>
                        <span class="label">Luftfugtighed</span>
                        <span id="humidity">--%</span>
                    </div>
                </div>
                <div class="detail-card">
                    <i class="wi wi-wind"></i>
                    <div>
                        <span class="label">Vind</span>
                        <span id="wind">-- km/t</span>
                    </div>
                </div>
                <div class="detail-card">
                    <i class="wi wi-barometer"></i>
                    <div>
                        <span class="label">Lufttryk</span>
                        <span id="pressure">-- hPa</span>
                    </div>
                </div>
            </div>
            
            <div class="forecast">
                <h2>5-dages prognose</h2>
                <div class="forecast-container" id="forecast">
                    <!-- Forecast cards will be inserted here -->
                </div>
            </div>
        </main>
        
        <footer>
            <p>Data fra OpenWeatherMap | Sidst opdateret: <span id="last-updated">--</span></p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
